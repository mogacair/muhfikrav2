<!-- Section Data Siswa -->
<section id="section-datasiswa" class="app-section p-4 pb-24">
  <!-- Header Menu -->
  <div class="flex items-center justify-between mb-4">
    <div class="flex items-center gap-3">
      <button type="button" onclick="navigateBack()" class="w-11 h-11 flex items-center justify-center rounded-xl bg-gray-200 text-gray-700 active:scale-95 transition">
        <i class="fa-solid fa-arrow-left text-lg"></i>
      </button>
      <h1 class="text-xl font-bold text-gray-800 tracking-tight">Data Siswa</h1>
    </div>
    <!-- Tombol Download Excel -->
    <button type="button" onclick="downloadExcelSiswa()" class="flex items-center gap-2 bg-emerald-700 active:bg-emerald-800 text-white font-semibold text-base px-4 py-2.5 rounded-xl shadow transition active:scale-95">
      <i class="fa-solid fa-file-excel text-lg text-yellow-300"></i>
      <span>Unduh Excel</span>
    </button>
  </div>

  <!-- Filter & Kontrol -->
  <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 mb-4 space-y-3">
    <label for="filterKelas" class="block text-base font-semibold text-gray-700">Filter Rombel / Kelas</label>
    <div class="relative">
      <select id="filterKelas" onchange="applyFilterSiswa()" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-3 text-lg text-gray-800 appearance-none focus:outline-none focus:ring-2 focus:ring-emerald-600">
        <option value="">Semua Kelas</option>
        <option value="X TKJ 1">X TKJ 1</option>
        <option value="X TKJ 2">X TKJ 2</option>
        <option value="XI TKJ">XI TKJ</option>
        <option value="XII TKJ">XII TKJ</option>
      </select>
      <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"></i>
    </div>
  </div>

  <!-- Container Tabel / List Siswa -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse" id="tableSiswa">
        <thead>
          <tr class="bg-gray-100 border-b border-gray-200 text-gray-700 text-base font-bold">
            <th class="py-3.5 px-3 text-center w-12">No</th>
            <th class="py-3.5 px-3">NISN</th>
            <th class="py-3.5 px-4">Nama Siswa</th>
            <th class="py-3.5 px-3 text-center">Kelas</th>
          </tr>
        </thead>
        <tbody id="tbodySiswa" class="divide-y divide-gray-100 text-base text-gray-800">
          <!-- Diisi dinamis via script.html -->
        </tbody>
      </table>
    </div>
    <!-- Loading State & Empty State -->
    <div id="loadingSiswa" class="py-8 text-center hidden">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-emerald-600"></i>
      <p class="text-base text-gray-500 mt-2">Memuat data siswa...</p>
    </div>
    <div id="emptySiswa" class="py-8 text-center hidden">
      <i class="fa-solid fa-folder-open text-3xl text-gray-400"></i>
      <p class="text-base text-gray-500 mt-2">Tidak ada data yang cocok.</p>
    </div>
  </div>
</section>

<!-- Bottom Sheet / Modal Detail Siswa -->
<div id="modalDetailSiswa" class="fixed inset-0 z-50 flex items-end justify-center bg-black/50 backdrop-blur-xs transition-opacity duration-300 opacity-0 pointer-events-none">
  <div class="bg-white w-full max-w-lg rounded-t-3xl p-6 shadow-2xl transform transition-transform duration-300 translate-y-full max-h-[85vh] overflow-y-auto">
    <!-- Baris Penutup / Drag Handle -->
    <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
    
    <div class="flex items-center justify-between pb-3 border-b border-gray-200">
      <h2 class="text-xl font-bold text-gray-800">Detail Biodata Siswa</h2>
      <button type="button" onclick="closeModalDetail()" class="w-9 h-9 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center active:scale-90 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Konten Biodata Berukuran Besar & Jelas -->
    <div class="mt-4 space-y-3.5 text-base" id="detailContent">
      <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        <span class="block text-sm text-gray-500 font-medium">Nama Lengkap</span>
        <span id="detNama" class="text-lg font-bold text-emerald-800"></span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
          <span class="block text-sm text-gray-500 font-medium">NIS / NIPD</span>
          <span id="detNis" class="font-semibold text-gray-800"></span>
        </div>
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
          <span class="block text-sm text-gray-500 font-medium">NISN</span>
          <span id="detNisn" class="font-semibold text-gray-800"></span>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
          <span class="block text-sm text-gray-500 font-medium">Kelas</span>
          <span id="detKelas" class="font-semibold text-emerald-700"></span>
        </div>
        <div class="bg-gray-50 p-3 rounded-xl border border-gray-100">
          <span class="block text-sm text-gray-500 font-medium">Jenis Kelamin</span>
          <span id="detJk" class="font-semibold text-gray-800"></span>
        </div>
      </div>
      <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        <span class="block text-sm text-gray-500 font-medium">Tempat, Tanggal Lahir</span>
        <span id="detTtl" class="font-semibold text-gray-800"></span>
      </div>
      <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        <span class="block text-sm text-gray-500 font-medium">Nama Ibu Kandung</span>
        <span id="detIbu" class="font-semibold text-gray-800"></span>
      </div>
      <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100">
        <span class="block text-sm text-gray-500 font-medium">Alamat Tinggal</span>
        <p id="detAlamat" class="font-semibold text-gray-800 leading-relaxed"></p>
      </div>
    </div>
  </div>
</div>
