<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  // State Data Global Siswa
  let masterDataSiswa = [
    {
      no: 1,
      nipd: "23241001",
      nisn: "0076543210",
      nama: "Ahmad Fauzi",
      kelas: "X TKJ 1",
      jk: "Laki-laki",
      ttl: "Karanganyar, 12 Mei 2008",
      ibu: "Siti Aminah",
      alamat: "Dusun Papahan RT 02/03, Tasikmadu"
    },
    {
      no: 2,
      nipd: "23241002",
      nisn: "0081234567",
      nama: "Dewi Nur Rohmah",
      kelas: "X TKJ 2",
      jk: "Perempuan",
      ttl: "Surakarta, 24 Agustus 2008",
      ibu: "Sri Wahyuni",
      alamat: "Jl. Lawu No. 45, Bejen, Karanganyar"
    },
    {
      no: 3,
      nipd: "22231015",
      nisn: "0069876543",
      nama: "Bambang Pamungkas",
      kelas: "XI TKJ",
      jk: "Laki-laki",
      ttl: "Wonogiri, 10 Januari 2007",
      ibu: "Endang Mulyani",
      alamat: "Ngringo RT 04/01, Jaten"
    }
  ];

  let filteredDataSiswa = [...masterDataSiswa];

  // Sistem History & Navigasi Mobile Back Button
  window.addEventListener('DOMContentLoaded', () => {
    // Inisialisasi state awal aplikasi
    history.replaceState({ section: 'dashboard' }, 'Dashboard', '');
    renderTabelSiswa(filteredDataSiswa);
  });

  window.addEventListener('popstate', (event) => {
    const state = event.state;
    // Jika modal sedang terbuka saat gesture back ditekan, tutup modal lebih dahulu
    const modal = document.getElementById('modalDetailSiswa');
    if (modal && modal.classList.contains('active')) {
      closeModalDetail(false);
      return;
    }

    if (state && state.section) {
      showSection(state.section, false);
    } else {
      showSection('dashboard', false);
    }
  });

  function navigateTo(sectionId) {
    history.pushState({ section: sectionId }, '', '');
    showSection(sectionId, false);
  }

  function navigateBack() {
    window.history.back();
  }

  function showSection(sectionId, updateHistory = true) {
    document.querySelectorAll('.app-section').forEach(el => {
      el.classList.remove('active');
      el.style.display = 'none';
    });

    const target = document.getElementById(`section-${sectionId}`);
    if (target) {
      target.style.display = 'block';
      setTimeout(() => target.classList.add('active'), 10);
    }

    if (updateHistory) {
      history.pushState({ section: sectionId }, '', '');
    }
  }

  // Render Tabel Siswa
  function renderTabelSiswa(data) {
    const tbody = document.getElementById('tbodySiswa');
    const emptyEl = document.getElementById('emptySiswa');
    tbody.innerHTML = '';

    if (!data || data.length === 0) {
      emptyEl.classList.remove('hidden');
      return;
    }
    emptyEl.classList.add('hidden');

    data.forEach((siswa, index) => {
      const tr = document.createElement('tr');
      tr.className = 'border-b border-gray-100 row-clickable cursor-pointer transition';
      tr.innerHTML = `
        <td class="py-4 px-3 text-center text-gray-500 font-medium">${index + 1}</td>
        <td class="py-4 px-3 text-gray-600 font-mono text-sm">${siswa.nisn}</td>
        <td class="py-4 px-4 font-bold text-gray-900 text-lg flex items-center justify-between">
          <span>${siswa.nama}</span>
          <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
        </td>
        <td class="py-4 px-3 text-center">
          <span class="inline-block bg-emerald-100 text-emerald-800 font-semibold text-xs px-2.5 py-1 rounded-full border border-emerald-300">
            ${siswa.kelas}
          </span>
        </td>
      `;
      tr.addEventListener('click', () => showDetailSiswa(siswa));
      tbody.appendChild(tr);
    });
  }

  // Filter Data Siswa
  function applyFilterSiswa() {
    const selectedKelas = document.getElementById('filterKelas').value;
    if (selectedKelas === "") {
      filteredDataSiswa = [...masterDataSiswa];
    } else {
      filteredDataSiswa = masterDataSiswa.filter(item => item.kelas === selectedKelas);
    }
    renderTabelSiswa(filteredDataSiswa);
  }

  // Tampilkan Modal Detail
  function showDetailSiswa(siswa) {
    document.getElementById('detNama').textContent = siswa.nama;
    document.getElementById('detNis').textContent = siswa.nipd;
    document.getElementById('detNisn').textContent = siswa.nisn;
    document.getElementById('detKelas').textContent = siswa.kelas;
    document.getElementById('detJk').textContent = siswa.jk;
    document.getElementById('detTtl').textContent = siswa.ttl;
    document.getElementById('detIbu').textContent = siswa.ibu;
    document.getElementById('detAlamat').textContent = siswa.alamat;

    const modal = document.getElementById('modalDetailSiswa');
    modal.classList.add('active');

    // Tambah entri state agar tombol back menutup modal, bukan ganti halaman
    history.pushState({ modal: 'detailSiswa' }, '', '');
  }

  function closeModalDetail(triggerBack = true) {
    const modal = document.getElementById('modalDetailSiswa');
    modal.classList.remove('active');
    if (triggerBack && history.state && history.state.modal === 'detailSiswa') {
      window.history.back();
    }
  }

  // Unduh Data ke File Excel (.xlsx)
  function downloadExcelSiswa() {
    if (filteredDataSiswa.length === 0) {
      alert("Tidak ada data untuk diunduh.");
      return;
    }

    const formatData = filteredDataSiswa.map((item, idx) => ({
      "No": idx + 1,
      "NIS/NIPD": item.nipd,
      "NISN": item.nisn,
      "Nama Siswa": item.nama,
      "Kelas": item.kelas,
      "Jenis Kelamin": item.jk,
      "TTL": item.ttl,
      "Nama Ibu": item.ibu,
      "Alamat": item.alamat
    }));

    const ws = XLSX.utils.json_to_sheet(formatData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Data Siswa");
    
    const kelasTerpilih = document.getElementById('filterKelas').value || "Semua_Kelas";
    XLSX.writeFile(wb, `Data_Siswa_${kelasTerpilih.replace(/\s+/g, '_')}.xlsx`);
  }

  // Fungsi hook integrasi GAS (bisa dipanggil saat live nanti)
  function fetchSiswaFromGAS() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      document.getElementById('loadingSiswa').classList.remove('hidden');
      google.script.run
        .withSuccessHandler((res) => {
          masterDataSiswa = res;
          applyFilterSiswa();
          document.getElementById('loadingSiswa').classList.add('hidden');
        })
        .withFailureHandler((err) => {
          console.error(err);
          document.getElementById('loadingSiswa').classList.add('hidden');
        })
        .getDataSiswaGAS();
    }
  }
</script>
